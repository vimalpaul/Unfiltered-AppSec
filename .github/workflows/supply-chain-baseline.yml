name: Supply-chain baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-and-tests:
    name: Read-only integrity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch exact event commit
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_READ_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${EVENT_SHA}"
          unset AUTH GH_READ_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"

      - name: Run standard-library unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s implementations/13-software-supply-chain-security/tests -v

      - name: Generate and verify source integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 implementations/13-software-supply-chain-security/scripts/release_manifest.py generate --root . --output /tmp/release-manifest.json
          python3 implementations/13-software-supply-chain-security/scripts/release_manifest.py verify --root . --manifest /tmp/release-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/release-manifest.json").read_text())
          print(f"Source integrity records: {len(manifest['entries'])}")
          print("NOTE: This is a file-integrity inventory, not an SBOM or provenance attestation.")
          PY
